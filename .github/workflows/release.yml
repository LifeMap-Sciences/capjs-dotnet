name: release

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish-nuget:
    runs-on: windows-latest
    environment:
      name: nuget-publish
      url: https://www.nuget.org/packages/CapNet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version $version"

      - name: Pack
        run: dotnet pack CapNet/CapNet.csproj --configuration Release --nologo -o packages /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push to nuget.org
        run: dotnet nuget push packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
