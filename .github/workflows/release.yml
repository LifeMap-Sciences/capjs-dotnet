name: release

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish-nuget:
    runs-on: windows-latest
    environment:
      name: nuget-publish
      url: https://www.nuget.org/packages/CapNet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version $version"

      - name: Pack
        shell: pwsh
        run: dotnet pack CapNet/CapNet.csproj --configuration Release --nologo -o packages /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $pkg = Get-ChildItem packages/*.nupkg | Where-Object { $_.Name -notlike '*.symbols.nupkg' } | Select-Object -First 1
          if (-not $pkg) { throw "No .nupkg found in packages/" }
          Write-Host "Pushing $($pkg.FullName)"
          dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "nuget push failed (exit $LASTEXITCODE)" }
