<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CapNet demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #111827; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .mode { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; }
    .mode.armed { background: #fef3c7; color: #78350f; }
    .mode.test  { background: #dbeafe; color: #1e3a8a; }
    #status { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 6px; background: #f4f4f5; min-height: 2.5rem; }
    #status.ok  { background: #dcfce7; color: #14532d; }
    #status.bad { background: #fee2e2; color: #7f1d1d; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; font-size: 1rem; }
    code { background: #f4f4f5; padding: 0 4px; border-radius: 3px; }
    .protocols { font-size: 0.85rem; color: #4b5563; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>CapNet demo</h1>
  <div id="modeChip" class="mode armed">Armed (instrumentation blocks automated browsers)</div>
  <p class="protocols">sha256-pow + instrumentation (Format 2 + RSW available via API, see tests)</p>
  <p>Solve the captcha, then click <em>Submit</em>. Append <code>?bypass=1</code> to URL for test mode (non-blocking instrumentation).</p>

  <cap-widget
    id="cap"
    data-cap-i18n-initial-state="Click to verify"
    data-cap-i18n-verifying-label="Solving…"
    data-cap-i18n-solved-label="Verified ✓"></cap-widget>

  <button id="submit" disabled>Submit</button>
  <div id="status" data-testid="status">Initialising…</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const bypass = urlParams.get('bypass') === '1';
    const apiPrefix = bypass ? '/cap-test/' : '/cap/';

    // Self-hosted assets — point the widget's WASM loader at our own /cap-assets/ route
    // before the script tag below executes.
    window.CAP_CUSTOM_WASM_URL = '/cap-assets/cap_wasm_bg.wasm';

    const widget = document.getElementById('cap');
    widget.setAttribute('data-cap-api-endpoint', apiPrefix);

    const chip = document.getElementById('modeChip');
    if (bypass) {
      chip.className = 'mode test';
      chip.textContent = 'Test mode (instrumentation present but non-blocking)';
    }

    const btn    = document.getElementById('submit');
    const status = document.getElementById('status');
    let redeemToken = null;

    widget.addEventListener('solve', (ev) => {
      redeemToken = ev.detail?.token;
      status.textContent = 'Captcha solved. Ready to submit.';
      status.className = '';
      btn.disabled = !redeemToken;
    });

    widget.addEventListener('error', (ev) => {
      status.textContent = 'Captcha error: ' + (ev.detail?.message || 'blocked or failed');
      status.className = 'bad';
    });

    widget.addEventListener('reset', () => {
      redeemToken = null;
      btn.disabled = true;
      status.textContent = 'Captcha reset.';
      status.className = '';
    });

    function autoSolve() {
      if (typeof widget.solve === 'function') {
        status.textContent = 'Solving captcha…';
        widget.solve().catch((e) => {
          status.textContent = 'Solve failed: ' + (e?.message || e);
          status.className = 'bad';
        });
      } else {
        setTimeout(autoSolve, 50);
      }
    }
    autoSolve();

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Verifying with server…';
      try {
        const r = await fetch('/verify/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: redeemToken }),
        });
        const data = await r.json();
        if (r.ok && data.success) {
          status.textContent = 'Success: redeem token accepted by server.';
          status.className = 'ok';
        } else {
          status.textContent = 'Server rejected token (HTTP ' + r.status + ').';
          status.className = 'bad';
        }
      } catch (e) {
        status.textContent = 'Network error: ' + e.message;
        status.className = 'bad';
      }
    });
  </script>

  <script src="/cap-assets/cap.min.js" defer></script>
</body>
</html>
